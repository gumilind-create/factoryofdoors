services:
  - type: web
    name: fabrika-dverey
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    # Чтобы изменения из админки не пропадали (платный тариф):
    # поменяйте plan на starter, раскомментируйте блок ниже и добавьте переменную DATA_DIR=/var/data
    # disk:
    #   name: data
    #   mountPath: /var/data
    #   sizeGB: 1
